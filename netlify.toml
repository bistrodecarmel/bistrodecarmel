[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- SEO preservation: redirects from retired/legacy pages on the old WordPress site ---
# See content-inventory.md, "נספח: 30 עמודי SEO/בלוג נוספים" for the full audit these are based on.

# Stale WordPress theme demo page (old phone number, "2023" content) -> homepage
[[redirects]]
  from = "/frontpage/"
  to = "/"
  status = 301
  force = true

