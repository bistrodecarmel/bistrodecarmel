# ============================================================================
# ⚠️  חוסם אינדוקס — למחוק ביום שהאתר עולה על bistrodecarmel.co.il
# ============================================================================
# כל עוד האתר חי רק על bistrodecarmel.netlify.app, אסור שגוגל יאנדקס אותו:
# תת-דומיין של netlify שנתפס באינדקס מתחרה בדומיין האמיתי על אותן מילות
# חיפוש, ואחר כך צריך לנקות את זה.
#
# X-Robots-Tag ולא robots.txt: חסימה ב-robots.txt מונעת סריקה אבל לא מונעת
# הופעה באינדקס (גוגל עדיין יכול להציג את הכתובת בלי תיאור). noindex בכותרת
# HTTP הוא ההוראה שבאמת מוציאה עמוד מהאינדקס.
#
# הכלל חל על כל הדומיינים — netlify.toml לא יודע להתנות כותרת לפי Host.
# לכן ברגע שמחברים את הדומיין האמיתי, חובה למחוק את הבלוק הזה, אחרת האתר
# החדש יעלה לאוויר בלתי-נראה לגוגל.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
